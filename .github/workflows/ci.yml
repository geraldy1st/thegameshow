name: CI
on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04 # Playwright 1.55 has no browser build for ubuntu-latest (26.04)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run check:no-test-hook
      - run: npm run check:no-budget-fake
      - run: npm run check:harness-detected
      - run: npm audit --audit-level=critical
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      # Hosted runners have been failing DNS for *.ubuntu.com (curl 28 resolve
      # timeout on azure.archive.ubuntu.com, then Temporary failure resolving
      # archive.ubuntu.com / security.ubuntu.com). apt then retries each package
      # for 20s and never reaches the browser download. Public resolvers first,
      # browsers from the Playwright CDN next, OS deps with a hard cap.
      - name: Restore DNS for Ubuntu apt archives
        run: |
          set -euo pipefail
          printf '%s\n' 'Acquire::ForceIPv4 "true";' 'Acquire::Retries "2";' 'Acquire::http::Timeout "10";' 'Acquire::https::Timeout "10";' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          echo "resolv.conf before:"
          cat /etc/resolv.conf || true
          sudo rm -f /etc/resolv.conf
          printf '%s\n' 'options timeout:2 attempts:2 ndots:1' 'nameserver 1.1.1.1' 'nameserver 8.8.8.8' 'nameserver 9.9.9.9' | sudo tee /etc/resolv.conf >/dev/null
          echo "resolv.conf after:"
          cat /etc/resolv.conf
          getent ahostsv4 archive.ubuntu.com || true
          getent ahostsv4 security.ubuntu.com || true
          mirror=""
          for url in \
            http://azure.archive.ubuntu.com/ubuntu/dists/noble/InRelease \
            http://archive.ubuntu.com/ubuntu/dists/noble/InRelease \
            http://us.archive.ubuntu.com/ubuntu/dists/noble/InRelease \
            http://mirrors.edge.kernel.org/ubuntu/dists/noble/InRelease
          do
            if curl -4 -fsS --connect-timeout 5 --max-time 8 -o /dev/null "$url"; then
              mirror="${url%/dists/noble/InRelease}/"
              echo "Using apt mirror ${mirror}"
              break
            fi
            echo "Unreachable: $url"
          done
          if [[ -n "$mirror" && -f /etc/apt/apt-mirrors.txt ]]; then
            printf '%s\n' "$mirror" 'http://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i \
              -e "s|http://azure.archive.ubuntu.com/ubuntu/|${mirror}|g" \
              -e "s|http://archive.ubuntu.com/ubuntu/|${mirror}|g" \
              /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          fi
      - name: Install Playwright browsers
        timeout-minutes: 8
        run: |
          set -euo pipefail
          npx playwright install chromium webkit
          if ! timeout 2m npx playwright install-deps chromium webkit; then
            echo "::warning::playwright install-deps failed or timed out; continuing with runner image libraries"
            sudo killall -9 apt-get apt 2>/dev/null || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true
          fi
      # GS-V5-02 (D7): home budget <= 500 KB, blocking; then the gauge must fail on 600 KB fake.
      - run: npm run budget:home
      - run: npm run budget:gauge
      # GS-V5-55 (OD-10): Travailler entry <= 200 KB beyond the home (<= 530 KB direct), stills
      # <= 150 KB, all blocking (Google Chrome: H.264); then the 600 KB fake video must fail.
      - run: npm run budget:work
      - run: npm run budget:work:still
      - name: Install ffmpeg (fake video for the gauge)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null; then
            ffmpeg -version | head -1
            exit 0
          fi
          sudo timeout 2m apt-get update
          sudo timeout 2m apt-get install -y ffmpeg
      - run: npm run budget:work:gauge
      - run: npm run test:e2e
        env:
          CI: 'true'
      # Deployment lives in pages.yml (main only).
      # Built artifacts of this commit (lot 4): production and test-harness builds.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-test-${{ github.sha }}
          path: dist-test
          if-no-files-found: error
          retention-days: 14
